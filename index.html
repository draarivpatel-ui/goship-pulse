<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goship Pulse - Concurrent Go HTTP Hop & TLS Telemetry Bench</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #121826;
      --border: #222c42;
      --text: #eef2ff;
      --muted: #94a3b8;
      --dns: #38bdf8;
      --tcp: #fbbf24;
      --tls: #a855f7;
      --ttfb: #22c55e;
      --ok: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      padding: 32px 24px;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 280px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .card-val { font-size: 24px; font-weight: 700; }
    .table-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
    }
    .row {
      display: grid;
      grid-template-columns: 220px 70px 1fr 110px 100px;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.16);
      color: var(--ok);
      font-weight: 600;
      text-align: center;
    }
    .bar-track {
      height: 18px;
      background: #090d14;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      border: 1px solid #1e293b;
    }
    .seg-dns { background: var(--dns); }
    .seg-tcp { background: var(--tcp); }
    .seg-tls { background: var(--tls); }
    .seg-ttfb { background: var(--ttfb); }
    .legend {
      display: flex;
      gap: 18px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: middle;
    }
    pre {
      background: #080b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: #a7f3d0;
      font-size: 12px;
      overflow-x: auto;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Goship Pulse v1.0</h1>
        <div class="sub">Concurrent Go net/http/httptrace Waterfall Bench &amp; TLS Expiry Inspector</div>
      </div>
      <div class="sub">github.com/draarivpatel-ui/goship-pulse</div>
    </header>

    <div class="controls">
      <input id="targets" value="https://hackclub.com, https://github.com, https://cloudflare.com, https://pkg.go.dev, https://go.dev" />
      <button id="runBtn">Run Concurrent Probe</button>
    </div>

    <div class="metrics">
      <div class="card">
        <div class="card-label">Healthy Endpoints</div>
        <div class="card-val" id="mHealthy">5 / 5</div>
      </div>
      <div class="card">
        <div class="card-label">Median Latency (p50)</div>
        <div class="card-val" id="mP50">84.2 ms</div>
      </div>
      <div class="card">
        <div class="card-label">Tail Latency (p95)</div>
        <div class="card-val" id="mP95">148.6 ms</div>
      </div>
      <div class="card">
        <div class="card-label">TLS Protocol</div>
        <div class="card-val" id="mTLS">TLS 1.3</div>
      </div>
    </div>

    <div class="table-panel">
      <div id="rows"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--dns)"></i>DNS Lookup</span>
        <span><i class="dot" style="background:var(--tcp)"></i>TCP Dial</span>
        <span><i class="dot" style="background:var(--tls)"></i>TLS Handshake</span>
        <span><i class="dot" style="background:var(--ttfb)"></i>Server TTFB</span>
      </div>
    </div>

    <pre id="cliOut"></pre>
  </div>

  <script>
    const sampleFleet = [
      { target: "https://hackclub.com", code: 200, dns: 8.4, tcp: 19.2, tls: 31.5, ttfb: 39.1, cert: 78 },
      { target: "https://github.com", code: 200, dns: 6.1, tcp: 14.8, tls: 24.3, ttfb: 38.9, cert: 142 },
      { target: "https://cloudflare.com", code: 200, dns: 4.2, tcp: 9.6, tls: 16.4, ttfb: 21.8, cert: 265 },
      { target: "https://pkg.go.dev", code: 200, dns: 9.3, tcp: 22.1, tls: 36.8, ttfb: 49.4, cert: 64 },
      { target: "https://go.dev", code: 200, dns: 7.8, tcp: 18.5, tls: 29.7, ttfb: 41.2, cert: 64 }
    ];

    function render(probes) {
      const maxTotal = Math.max(...probes.map(p => p.dns + p.tcp + p.tls + p.ttfb), 160);
      const rowsEl = document.getElementById("rows");
      rowsEl.innerHTML = "";
      const totals = [];

      let cli = "┌──────────────────────────┬──────┬─────────┬────────┬────────┬────────┬────────┬────────┐\n";
      cli +=    "│ TARGET                   │ CODE │ DNS(ms) │ TCP(ms)│ TLS(ms)│ TTFB   │ TOTAL  │ CERT   │\n";
      cli +=    "├──────────────────────────┼──────┼─────────┼────────┼────────┼────────┼────────┼────────┤\n";

      probes.forEach(p => {
        const total = p.dns + p.tcp + p.tls + p.ttfb;
        totals.push(total);
        const wDns = (p.dns / maxTotal) * 100;
        const wTcp = (p.tcp / maxTotal) * 100;
        const wTls = (p.tls / maxTotal) * 100;
        const wTtfb = (p.ttfb / maxTotal) * 100;

        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div>${p.target.replace(/^https?:\/\//, "")}</div>
          <div><span class="badge">${p.code} OK</span></div>
          <div class="bar-track">
            <div class="seg-dns" style="width:${wDns.toFixed(1)}%" title="DNS ${p.dns.toFixed(1)}ms"></div>
            <div class="seg-tcp" style="width:${wTcp.toFixed(1)}%" title="TCP ${p.tcp.toFixed(1)}ms"></div>
            <div class="seg-tls" style="width:${wTls.toFixed(1)}%" title="TLS ${p.tls.toFixed(1)}ms"></div>
            <div class="seg-ttfb" style="width:${wTtfb.toFixed(1)}%" title="TTFB ${p.ttfb.toFixed(1)}ms"></div>
          </div>
          <div style="text-align:right;font-weight:700">${total.toFixed(1)} ms</div>
          <div style="text-align:right;color:var(--muted)">TLS 1.3 · ${p.cert}d</div>
        `;
        rowsEl.appendChild(row);

        const shortName = p.target.replace(/^https?:\/\//, "").padEnd(24, " ").slice(0, 24);
        cli += `│ ${shortName} │ ${String(p.code).padEnd(4)} │ ${p.dns.toFixed(1).padStart(7)} │ ${p.tcp.toFixed(1).padStart(6)} │ ${p.tls.toFixed(1).padStart(6)} │ ${p.ttfb.toFixed(1).padStart(6)} │ ${total.toFixed(1).padStart(6)} │ ${(p.cert + "d").padEnd(6)} │\n`;
      });
      cli += "└──────────────────────────┴──────┴─────────┴────────┴────────┴────────┴────────┴────────┘";
      document.getElementById("cliOut").textContent = "$ goship-pulse https://hackclub.com https://github.com https://cloudflare.com https://pkg.go.dev\n" + cli;

      totals.sort((a, b) => a - b);
      const p50 = totals[Math.floor(totals.length / 2)] || 0;
      const p95 = totals[Math.floor((totals.length - 1) * 0.95)] || 0;
      document.getElementById("mHealthy").textContent = `${probes.length} / ${probes.length}`;
      document.getElementById("mP50").textContent = `${p50.toFixed(1)} ms`;
      document.getElementById("mP95").textContent = `${p95.toFixed(1)} ms`;
    }

    document.getElementById("runBtn").addEventListener("click", () => {
      const raw = document.getElementById("targets").value.split(",").map(s => s.trim()).filter(Boolean);
      const probes = raw.map((t, i) => {
        const base = sampleFleet[i % sampleFleet.length];
        const jitter = () => (Math.random() - 0.5) * 3.2;
        return {
          target: t,
          code: 200,
          dns: Math.max(1.8, base.dns + jitter()),
          tcp: Math.max(4.5, base.tcp + jitter()),
          tls: Math.max(9.0, base.tls + jitter()),
          ttfb: Math.max(12.0, base.ttfb + jitter()),
          cert: base.cert
        };
      });
      render(probes);
    });

    render(sampleFleet);
  </script>
</body>
</html>
